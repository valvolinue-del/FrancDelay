name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Cache the FetchContent download and the tiny populate project that records
      # it (juce-src and juce-subbuild). The compiled JUCE tree is not its own
      # CMake build: FetchContent adds it into the parent build, so caching that
      # object directory across a fresh parent build is not reliable.
      - name: Cache JUCE FetchContent
        uses: actions/cache@v5
        with:
          path: |
            fc-cache/juce-src
            fc-cache/juce-subbuild
          key: juce-8.0.15-${{ runner.os }}-fetchcontent-v1

      - name: Configure and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.longpaths true
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $line = & $vswhere -latest -products * -property catalog_productLineVersion
          $line = "$line".Trim()
          if (-not $line) {
            if (Test-Path 'C:\Program Files\Microsoft Visual Studio\18\Enterprise') { $line = '18' }
            elseif (Test-Path 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise') { $line = '17' }
          }
          switch ("$line") {
            '18' { $generator = 'Visual Studio 18 2026' }
            '17' { $generator = 'Visual Studio 17 2022' }
            default { throw "Unsupported Visual Studio product line '$line'. Expected 17 (2022) or 18 (2026)." }
          }
          Write-Host "Using CMake generator: $generator"
          $fc = ((Join-Path $env:GITHUB_WORKSPACE 'fc-cache') -replace '\\','/')
          cmake -S . -B build -G "$generator" -A x64 "-DFETCHCONTENT_BASE_DIR=$fc"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate Release bundles
        id: paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vst3 = Join-Path $env:GITHUB_WORKSPACE 'build\FrancDelay_artefacts\Release\VST3\FrancDelay.vst3'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'build\FrancDelay_artefacts\Release\Standalone\FrancDelay.exe'
          if (-not (Test-Path $vst3 -PathType Container)) {
            Write-Host 'Release tree:'
            if (Test-Path build) { Get-ChildItem -Recurse build -Depth 4 | ForEach-Object { $_.FullName } }
            throw "VST3 bundle not found at $vst3"
          }
          $inner = @(Get-ChildItem -Path $vst3 -Recurse -File -Filter '*.vst3')
          if ($inner.Count -lt 1) { throw "FrancDelay.vst3 has no plugin binary inside the bundle" }
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Standalone executable not found at $exe" }
          "vst3=$vst3" >> $env:GITHUB_OUTPUT
          "exe=$exe" >> $env:GITHUB_OUTPUT
          Write-Host "VST3: $vst3"
          $inner | ForEach-Object { Write-Host $_.FullName }
          Write-Host "Standalone: $exe"

      # Optional Windows Authenticode signing.
      #
      # This job succeeds without a certificate. Windows zips are unsigned unless
      # this stub is replaced. To turn it on, add repository secrets and replace
      # the body below with signtool (sign before the zip step so the archive
      # contains the signed files):
      #
      #   WINDOWS_CERTIFICATE_PFX        base64 of a .pfx code-signing certificate
      #   WINDOWS_CERTIFICATE_PASSWORD   password for that .pfx
      #
      #   $pfx = Join-Path $env:RUNNER_TEMP 'authenticode.pfx'
      #   [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
      #   $binary = Get-ChildItem -Path $env:VST3 -Recurse -File -Filter '*.vst3' | Select-Object -First 1
      #   signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
      #     /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
      #     $env:EXE $binary.FullName
      #   Remove-Item -Force $pfx
      #
      # The step is gated. With the secrets unset it is skipped and the build
      # stays green. The body is intentionally not a real signature yet.
      - name: Detect optional Authenticode secrets
        id: authenticode
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxSet = -not [string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PFX)
          $passwordSet = -not [string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($pfxSet -ne $passwordSet) {
            throw 'Set both WINDOWS_CERTIFICATE_PFX and WINDOWS_CERTIFICATE_PASSWORD, or neither.'
          }
          if ($pfxSet) { 'enabled=true' >> $env:GITHUB_OUTPUT } else { 'enabled=false' >> $env:GITHUB_OUTPUT }

      - name: Authenticode sign (optional stub)
        if: steps.authenticode.outputs.enabled == 'true'
        shell: pwsh
        env:
          VST3: ${{ steps.paths.outputs.vst3 }}
          EXE: ${{ steps.paths.outputs.exe }}
        run: |
          Write-Host '::notice::WINDOWS_CERTIFICATE_PFX is set, but Authenticode signing is still a stub. The zip will contain unsigned binaries. The signtool invocation is in the comment on the detect step.'
          Write-Host "Would sign $env:EXE and the binary inside $env:VST3"

      - name: Package zip
        shell: pwsh
        env:
          VST3: ${{ steps.paths.outputs.vst3 }}
          EXE: ${{ steps.paths.outputs.exe }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'francdelay-windows'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse $env:VST3 (Join-Path $stage 'FrancDelay.vst3')
          Copy-Item $env:EXE (Join-Path $stage 'FrancDelay.exe')
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $zip = Join-Path $dist 'FrancDelay-windows-x64.zip'
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Push-Location $stage
          tar -a -c -f $zip FrancDelay.vst3 FrancDelay.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $listing = @(tar -tf $zip)
          $listing | ForEach-Object { Write-Host $_ }
          $text = $listing -join "`n"
          if ($text -notmatch 'FrancDelay\.exe') { throw 'Zip is missing FrancDelay.exe' }
          if ($text -notmatch 'FrancDelay\.vst3') { throw 'Zip is missing the FrancDelay.vst3 bundle' }
          "zip=$zip" >> $env:GITHUB_ENV
          @"
          ## Windows artifact
          ``FrancDelay-windows-x64.zip`` contains the ``FrancDelay.vst3`` bundle and ``FrancDelay.exe``.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrancDelay-windows-x64
          path: dist/FrancDelay-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache JUCE FetchContent
        uses: actions/cache@v5
        with:
          path: |
            fc-cache/juce-src
            fc-cache/juce-subbuild
          key: juce-8.0.15-${{ runner.os }}-fetchcontent-v1

      - name: Configure and build universal Release
        env:
          CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          cmake --version
          xcodebuild -version
          set -- \
            -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
            -DFETCHCONTENT_BASE_DIR="${GITHUB_WORKSPACE}/fc-cache"
          if command -v ninja >/dev/null 2>&1; then
            echo "Using Ninja"
            cmake -G Ninja "$@"
          else
            echo "Using the default Unix Makefiles generator"
            cmake "$@"
          fi
          cmake --build build --config Release --parallel

      - name: Sign, notarize, and package
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          bash .github/scripts/macos-sign-and-package.sh \
            build/FrancDelay_artefacts/Release/VST3/FrancDelay.vst3 \
            build/FrancDelay_artefacts/Release/Standalone/FrancDelay.app \
            dist/FrancDelay-macos-universal.zip \
            .github/macos/entitlements.plist
          {
            echo "## macOS artifact"
            echo
            echo "\`FrancDelay-macos-universal.zip\` contains universal \`FrancDelay.vst3\` and \`FrancDelay.app\` (arm64 + x86_64, deployment target 11.0)."
            echo
            echo '```'
            lipo -archs build/FrancDelay_artefacts/Release/Standalone/FrancDelay.app/Contents/MacOS/FrancDelay
            codesign -dv --verbose=2 build/FrancDelay_artefacts/Release/Standalone/FrancDelay.app 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrancDelay-macos-universal
          path: dist/FrancDelay-macos-universal.zip
          if-no-files-found: error

  release:
    name: Release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f -name '*.zip' | sort)
          echo "Release files:"
          printf '  %s\n' "${files[@]}"
          if [[ ${#files[@]} -ne 2 ]]; then
            echo "Expected the Windows and macOS zips." >&2
            find dist -type f >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          tag = os.environ["GITHUB_REF_NAME"]
          with open("release-notes.md", "w", encoding="utf-8") as notes:
              notes.write(f"""## FrancDelay {tag}

          - **Windows x64:** `FrancDelay-windows-x64.zip` contains the `FrancDelay.vst3` bundle and `FrancDelay.exe`.
          - **macOS universal (arm64 + x86_64), deployment target 11.0:** `FrancDelay-macos-universal.zip` contains `FrancDelay.vst3` and `FrancDelay.app`.

          Unzip the macOS archive with Finder or `ditto -x -k` so the bundles stay intact.

          macOS artifacts are Developer ID signed, notarized, and stapled when the Apple secrets in the README are set. Without those secrets they are ad-hoc signed.
          """)
          PY
          # The Python block is indented by the workflow YAML; strip that indent.
          sed -i 's/^          //' release-notes.md
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --title "FrancDelay ${tag}" --notes-file release-notes.md
          else
            gh release create "$tag" "${files[@]}" \
              --title "FrancDelay ${tag}" \
              --notes-file release-notes.md
          fi
